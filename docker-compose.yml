version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: gpu-platform-db
    environment:
      POSTGRES_USER: gpu_admin
      POSTGRES_PASSWORD: gpu_platform_secure_password_2024
      POSTGRES_DB: gpu_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpu_admin -d gpu_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: gpu-platform-redis
    command: redis-server --requirepass gpu_platform_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储
  minio:
    image: minio/minio:RELEASE.2024-01-01T00-00-00Z
    container_name: gpu-platform-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio_secure_password_2024
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # GPU Platform API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gpu-platform-api
    environment:
      DB_HOST: postgres
      DB_PASSWORD: gpu_platform_secure_password_2024
      REDIS_HOST: redis:6379
      REDIS_PASSWORD: gpu_platform_redis_password
      JWT_SECRET_KEY: gpu-platform-jwt-secret-key-change-in-production
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minio_secure_password_2024
      KUBERNETES_NAMESPACE: gpu-platform
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  # GPU Platform 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gpu-platform-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # Prometheus 监控
  prometheus:
    image: prometheus:v2.48.0
    container_name: gpu-platform-prometheus
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/petheus/consoles'
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Grafana 可视化
  grafana:
    image: grafana/grafana:10.2.0
    container_name: gpu-platform-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # NVIDIA GPU Exporter (需要在 GPU 节点上运行)
  gpu-exporter:
    image: mistydev/nvidia-exporter:latest
    container_name: gpu-platform-gpu-exporter
    privileged: true
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    ports:
      - "9400:9400"
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: gpu-platform-network
