apiVersion: v1
kind: Namespace
metadata:
  name: gpu-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-platform-config
  namespace: gpu-platform
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "gpu_platform"
  DB_USER: "gpu_admin"
  DB_PASSWORD: "change-password"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: "minio:9000"
  JWT_SECRET: "change-jwt-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-platform
  namespace: gpu-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-platform
  template:
    metadata:
      labels:
        app: gpu-platform
    spec:
      containers:
      - name: api
        image: gpu-platform/api:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: gpu-platform-config
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-platform
  namespace: gpu-platform
spec:
  selector:
    app: gpu-platform
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpu-platform
  namespace: gpu-platform
spec:
  rules:
  - host: gpu-platform.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gpu-platform
            port:
              number: 80
