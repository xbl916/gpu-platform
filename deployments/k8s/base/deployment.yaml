# GPU Platform K8s 部署配置
# 使用方法: kubectl apply -f deployments/k8s/base/

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-platform
  labels:
    gpu-platform.io/enabled: "true"

---
# ConfigMap - 应用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-platform-config
  namespace: gpu-platform
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "gpu_platform"
  DB_USER: "gpu_admin"
  DB_PASSWORD: "change-password"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: "minio:9000"
  JWT_SECRET: "change-jwt-secret"
  KUBERNETES_NAMESPACE: "gpu-platform"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-platform-api
  namespace: gpu-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-platform-api
  template:
    metadata:
      labels:
        app: gpu-platform-api
    spec:
      containers:
      - name: api
        image: gpu-platform/api:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: gpu-platform-config
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: gpu-platform
  namespace: gpu-platform
spec:
  selector:
    app: gpu-platform-api
  ports:
  - port: 80
    targetPort: 8080

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpu-platform
  namespace: gpu-platform
spec:
  rules:
  - host: gpu-platform.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gpu-platform
            port:
              number: 80

---
# ResourceQuota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-quota
  namespace: gpu-platform
spec:
  hard:
    nvidia.com/gpu: "100"
    cpu: "1000"
    memory: 4Ti

---
# LimitRange
apiVersion: v1
kind: LimitRange
metadata:
  name: gpu-limits
  namespace: gpu-platform
spec:
  limits:
  - max:
      nvidia.com/gpu: 8
      cpu: "64"
      memory: "256Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    type: Container
